<body>
    <nav class="nav-container">
        <div class="nav-content">

    <div class="blog-container">
        <aside class="sidebar">
            <div class="search-section">
                <h2 class="sidebar-title">Search</h2>
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Search posts..." autocomplete="off">
                    <i class="fas fa-search search-icon"></i>
                </div>
                
                <div class="search-filters">
                    <div class="filter-group">
                        <label class="filter-label">Sort by:</label>
                        <select id="sort-select" class="filter-select">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="relevance">Most Relevant</option>
                            <option value="popular">Most Popular</option>
                            <option value="category">By Category</option>
                        </select>
                    </div>
                    
                    <button id="clear-filters" class="clear-filters-btn">
                        <i class="fas fa-times"></i>
                        Clear
                    </button>
                </div>
            </div>
            
            <div class="categories-section">
                <h2 class="sidebar-title">Categories</h2>
                <ul id="categories-list" class="sidebar-list">
                    <!-- Categories will be dynamically loaded here -->
                </ul>
            </div>
        </aside>

        <main class="blog-list-container">
            <div id="blog-list">
                <!-- Blog posts will be dynamically loaded here -->
            </div>
            <div id="pagination" class="pagination">
                <!-- Pagination will be dynamically loaded here -->
            </div>
        </main>
