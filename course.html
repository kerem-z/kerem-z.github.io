<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="course-title">Course Details - Kerem Zengin</title>
    <meta name="description" id="course-description" content="Course details and information">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="reading-progress">
        <div class="reading-progress-bar"></div>
    </div>
    
    <div class="wrapper">
        <nav class="nav-container">
            <div class="nav-content">
                <div class="nav-left">
                    <div class="nav-links">
                        <a href="index.html" class="nav-button">Home</a>
                        <a href="blog-list.html" class="nav-button">Blog</a>
                        <a href="research.html" class="nav-button">Research</a>
                        <a href="courses.html" class="nav-button">Courses</a>
                    </div>
                    <button class="theme-toggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="post-container">
            <article id="course-content">
                <!-- Course content will be dynamically loaded here -->
            </article>
            
            <div class="course-navigation">
                <a href="courses.html" class="back-to-courses">
                    <i class="fas fa-arrow-left"></i>
                    Back to Courses
                </a>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="script.js"></script>
    <script src="analytics.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            loadCourseContent();
            initReadingProgress();
        });

        async function loadCourseContent() {
            const urlParams = new URLSearchParams(window.location.search);
            const courseFile = urlParams.get('course');
            
            if (!courseFile) {
                document.getElementById('course-content').innerHTML = '<p>Course not found.</p>';
                return;
            }

            try {
                const response = await fetch(`courses/${courseFile}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdown = await response.text();
                const html = marked.parse(markdown);
                
                // Process the HTML for math rendering
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                
                // Render math expressions
                const mathElements = tempDiv.querySelectorAll('code');
                mathElements.forEach(element => {
                    const text = element.textContent;
                    if (text.startsWith('$') && text.endsWith('$') && text.length > 2) {
                        const mathText = text.slice(1, -1);
                        try {
                            const rendered = katex.renderToString(mathText, {
                                throwOnError: false,
                                displayMode: false
                            });
                            element.outerHTML = rendered;
                        } catch (e) {
                            console.warn('KaTeX rendering failed:', e);
                        }
                    }
                });
                
                document.getElementById('course-content').innerHTML = tempDiv.innerHTML;
                
                // Update page title
                const firstH1 = tempDiv.querySelector('h1');
                if (firstH1) {
                    document.title = `${firstH1.textContent} - Kerem Zengin`;
                    document.getElementById('course-title').content = firstH1.textContent;
                }
                
            } catch (error) {
                console.error('Error loading course:', error);
                document.getElementById('course-content').innerHTML = '<p>Error loading course content.</p>';
            }
        }
    </script>
</body>
</html>
