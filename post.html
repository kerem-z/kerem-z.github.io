<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="style.css">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- The loading of KaTeX is deferred to speed up page rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.0/marked.min.js"></script>
</head>
<body>
    <!-- Reading Progress Bar -->
    <div class="reading-progress">
        <div class="reading-progress-bar"></div>
    </div>
    
    <div class="wrapper">
        <nav class="nav-container">
            <div class="nav-content">
                <div class="nav-left">
                    <div class="nav-links">
                        <a href="index.html" class="nav-button">Home</a>
                        <a href="blog-list.html" class="nav-button">Blog</a>
                        <a href="research.html" class="nav-button">Research</a>
                        <a href="courses.html" class="nav-button">Courses</a>
                    </div>
                    <button class="theme-toggle" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="post-container">
            <article id="post-content">
                <!-- Post content will be dynamically loaded here -->
            </article>

            <div class="research-links">
                <!-- Research links will be dynamically loaded here -->
            </div>
            
            
            <section class="comments-section">
                <h2>Discussion</h2>
                <p class="comments-info">Comments are handled via GitHub Issues</p>
                <div class="comments-actions">
                    <a href="#" id="view-comments-link" class="comments-btn primary" target="_blank" rel="noopener">
                        <i class="fas fa-comments"></i>
                        View Discussion
                    </a>
                    <a href="#" id="new-comment-link" class="comments-btn secondary" target="_blank" rel="noopener">
                        <i class="fas fa-plus"></i>
                        Start Discussion
                    </a>
                </div>
            </section>
            
            <section class="related-posts">
                <h2>Related Posts</h2>
                <div id="related-posts-container">
                    <!-- Related posts will be dynamically loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="script.js"></script>
    <script src="analytics.js"></script>
    <script src="github-comments.js"></script>
</body>
</html>
